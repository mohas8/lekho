<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lekho fixture: page for extension injection</title>
    <style>
      body { font: 16px system-ui, sans-serif; margin: 2rem; }
      label { display: block; margin: 1rem 0 0.25rem; }
      input, textarea { font: inherit; width: 30rem; padding: 0.25rem; }
    </style>
  </head>
  <body>
    <h1>Extension injection</h1>
    <p>This page does not load Lekho itself; the extension injects it on demand.</p>
    <label for="text">Text input</label>
    <input id="text" type="text" />
    <label for="area">Textarea</label>
    <textarea id="area" rows="4"></textarea>
    <label for="password">Password</label>
    <input id="password" type="password" />
  </body>
</html>
